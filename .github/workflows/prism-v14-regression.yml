name: PRISM V14 isolated full regression

on:
  push:
    branches:
      - feature/prism-v14-workflow-simplification-20261031
    paths:
      - '.github/workflows/prism-v14-regression.yml'
      - 'maintenance/**'
      - 'includes/**'
      - 'assets/**'
      - '*.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-regression:
    runs-on: windows-2022
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, zip, pdo_mysql, dom, ctype, fileinfo, iconv
          coverage: none
      - name: Composer dependencies
        shell: pwsh
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Install isolated MariaDB binaries and browser driver
        shell: pwsh
        run: |
          choco install mariadb --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'MariaDB package installation failed' }
          npm install --no-audit --no-fund --prefix .ci-browser playwright-core@1.57.0
          if ($LASTEXITCODE -ne 0) { throw 'Browser-driver installation failed' }
      - name: Configure portable test paths
        shell: pwsh
        run: |
          $phpPath = (Get-Command php.exe -ErrorAction Stop).Source.Replace('\','/')
          $chrome = @('C:\Program Files\Google\Chrome\Application\chrome.exe','C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$chrome) { throw 'Chrome/Edge binary not found on hosted runner' }
          $maria = Get-ChildItem 'C:\Program Files' -Filter 'mariadb-install-db.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$maria) { throw 'MariaDB installer executable not found on hosted runner' }
          $envBin = $maria.Directory.FullName
          $script = 'maintenance/onboarding-tests/local-env.ps1'
          $content = Get-Content $script -Raw
          $content = $content.Replace("C:/xampp/php/php.exe", $phpPath)
          $content = $content.Replace("C:/PRISM_Workspaces/prism-v13-release-clean/PRISM_V13_UI_REMEDIATION_AUDIT/browser-tools/node_modules/playwright-core", ((Join-Path (Get-Location) '.ci-browser/node_modules/playwright-core').Replace('\','/')))
          $content = $content.Replace("C:/Program Files/Google/Chrome/Application/chrome.exe", $chrome.Replace('\','/'))
          Set-Content $script -Value $content
          'PRISM_TEST_CI_MARIADB_BIN=' + $envBin | Out-File $env:GITHUB_ENV -Append
          Write-Host 'MariaDB binary directory:' $envBin
          Write-Host 'Using PHP:' $phpPath
          Write-Host 'Using browser:' $chrome
      - name: Source syntax and contract smoke
        shell: pwsh
        run: node maintenance/onboarding-tests/v14-simplification-smoke.cjs
      - name: Run entire disposable regression suite
        shell: pwsh
        run: |
          $review='PRISM_V14_ACTIONS_REGRESSION'
          .\maintenance\onboarding-tests\run-regression.ps1 -MariaDbBin $env:PRISM_TEST_CI_MARIADB_BIN -ReviewName $review -DbPort 13985 -AppPort 14985
      - name: Upload regression evidence even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-v14-regression-evidence
          path: |
            PRISM_V14_ACTIONS_REGRESSION/
          if-no-files-found: warn
          retention-days: 7
